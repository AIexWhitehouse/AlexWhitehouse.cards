<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1 class="title"> Playing Cards </h1>
  <main id="playing-cards">
    <div class="card">
      <div class="left">
        <p> A </p>
        <p> ♥ </p>
      </div>
      <div class="middle">
        <p class="middle-symbol"> ♥ </p>
      </div>
       
      <div class="right">
        <p> A </p>
        <p> ♥ </p>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <p> 3 </p>
        <p> ♦ </p>
      </div>
      <div class="middle">
        <p class="middle-symbol"> ♦ </p>
        <p class="middle-symbol"> ♦ </p>
        <p class="middle-symbol"> ♦ </p>
      </div>
      <div class="right">
        <p> 3 </p>
        <p> ♦ </p>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <p> 5 </p>
        <p> ♠ </p>
      </div>
      <div class="middle">
        <div class="row">
        <p class="middle-symbol"> ♠ </p>
        <p class="middle-symbol"> ♠ </p>
        </div>
         <div class="row">
        <p class="middle-symbol"> ♠ </p>
        </div>
         <div class="row">
        <p class="middle-symbol"> ♠ </p>
        <p class="middle-symbol"> ♠ </p>
         </div>
      </div>
      <div class="right">
        <p> 5 </p>
        <p> ♠ </p>
      </div>
    </div>
  </main>
</body>

</html>
